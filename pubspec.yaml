name: kidguardian
description: "Kura - Đồng Hành Số: Ứng dụng quản lý thời gian sử dụng mạng xã hội cho trẻ em"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.2.2
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.4
  
  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^8.0.2
  
  # Local Storage
  shared_preferences: ^2.3.4
  
  # Charts
  fl_chart: ^0.70.2
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  csv: ^6.0.0
  pdf: ^3.11.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  
  # External Apps
  url_launcher: ^6.3.1
  flutter_local_notifications: ^21.0.0
  
  # WebView & App Info
  webview_flutter: ^4.10.0
  package_info_plus: ^8.1.3
  rxdart: ^0.28.0
  installed_apps: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
